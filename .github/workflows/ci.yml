name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Deliberately before the GTK system libraries are installed: the backend
      # half of the crate must not need them. If a `use gtk::` drifts into
      # storage or sync, this is the step that catches it.
      - run: cargo check --no-default-features
      - name: Install GTK build dependencies
        run: |
          # Ubuntu runners sometimes hold this step open: the mirror accepts
          # the connection and then sends nothing. Bound that wait, and prefer
          # IPv4, which is the mirror path that answers.
          sudo tee /etc/apt/apt.conf.d/99-calix-ci-timeout >/dev/null <<'EOF'
          Acquire::ForceIPv4 "true";
          Acquire::Retries "5";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils libgtk-4-dev libadwaita-1-dev pkg-config
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: scripts/check-package.sh
