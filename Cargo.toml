[package]
name = "calix"
version = "0.4.0"
edition = "2024"

[features]
default = ["gui"]
# The GTK frontend. Off, the crate is calendar storage and sync with no
# windowing dependency at all — `cargo check --no-default-features` is what
# proves that seam hasn't leaked.
gui = ["dep:adw", "dep:gtk"]

[[bin]]
name = "calix"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"], optional = true }
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_14"], optional = true }
chrono = "0.4"
chrono-tz = "0.10"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
oauth2 = { version = "5.0.0", features = ["reqwest-blocking"] }
serde_json = "1.0.150"
url = "2.5.8"
keyring = { version = "4.1.4", default-features = false, features = ["v1", "zbus-secret-service-keyring-store"] }
